name: Scrape NSW Port Winds

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and parse Port Authority NSW & BOM Tides
        run: |
          python3 - << 'EOF'
          import urllib.request
          import re
          import json
          from datetime import datetime, timezone, timedelta

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
          }

          # 1. Fetch Port Authority NSW Live Observations
          url = "https://wavewindtide.portauthoritynsw.com.au/"
          req = urllib.request.Request(url, headers=headers)
          html = urllib.request.urlopen(req, timeout=25).read().decode('utf-8', errors='ignore')
          clean = re.sub(r'<[^>]+>', ' ', html)
          clean = re.sub(r'\s+', ' ', clean)

          def extract_wind(*labels):
              for label in labels:
                  idx = clean.find(label)
                  if idx != -1:
                      snippet = clean[idx:idx+450]
                      spd = re.search(r'(?:10 Min Mean Speed|Mean Speed):\s*([\d\.]+)\s*knots', snippet, re.I)
                      gust = re.search(r'Gust:\s*([\d\.]+)\s*knots', snippet, re.I)
                      d = re.search(r'Dir:\s*([\d\.]+)\s*deg', snippet, re.I)
                      if spd:
                          return {
                              "speed": spd.group(1),
                              "gust": gust.group(1) if gust else "--",
                              "dir": d
