name: Scrape NSW Port Winds

on:
  schedule:
    - cron: '*/5 * * * *' # Runs automatically every 5 minutes
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and parse Port Authority NSW
        run: |
          python3 - << 'EOF'
          import urllib.request
          import re
          import json
          from datetime import datetime, timezone, timedelta

          url = "https://wavewindtide.portauthoritynsw.com.au/"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          html = urllib.request.urlopen(req, timeout=20).read().decode('utf-8', errors='ignore')
          clean = re.sub(r'<[^>]+>', ' ', html)
          clean = re.sub(r'\s+', ' ', clean)

          def extract(station_label):
              idx = clean.find(station_label)
              if idx == -1:
                  return {"speed": "--", "gust": "--", "dir": "--", "time": "--"}
              snippet = clean[idx:idx+450]
              spd = re.search(r'10 Min Mean Speed:\s*([\d\.]+)\s*knots', snippet, re.I)
              if not spd:
                  spd = re.search(r'Mean Speed:\s*([\d\.]+)\s*knots', snippet, re.I)
              gust = re.search(r'Gust:\s*([\d\.]+)\s*knots', snippet, re.I)
              d = re.search(r'Dir:\s*([\d\.]+)\s*deg', snippet, re.I)
              t = re.search(r'at\s*(\d{4},\s*\d{1,2}\s*[A-Za-z]{3}\s*\d{4})', snippet, re.I)
              return {
                  "speed": spd.group(1) if spd else "--",
                  "gust": gust.group(1) if gust else "--",
                  "dir": d.group(1) if d else "--",
                  "time": t.group(1) if t else "--"
              }

          aest = timezone(timedelta(hours=11))
          data = {
              "updated": datetime.now(aest).strftime("%H:%M AEDT"),
              "wedding_cake": extract("Western Wedding Cake"),
              "fort_denison": extract("Fort Denison"),
              "ampol": extract("Ampol Wharf"),
              "molineaux": extract("Molineaux Point")
          }

          with open("data.json", "w") as f:
              json.dump(data, f, indent=2)
          EOF

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto-update Port Authority wind data"
          git push
