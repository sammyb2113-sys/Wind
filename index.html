<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSW Ports Live Wind</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 8px;
    }
    .widget-container {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #30363d;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 15px; margin: 0; font-weight: 700; color: #58a6ff; }
    .updated { font-size: 11px; color: #8b949e; }
    .port-section { margin-bottom: 10px; }
    .port-title {
      font-size: 11px;
      text-transform: uppercase;
      color: #3fb950;
      font-weight: 700;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .station-card {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 8px 10px;
    }
    .station-name { font-size: 12px; font-weight: 600; color: #f0f6fc; margin-bottom: 4px; }
    .wind-speed { font-size: 19px; font-weight: 800; color: #f0883e; }
    .wind-details { font-size: 11px; color: #8b949e; margin-top: 2px; }
  </style>
</head>
<body>

<div class="widget-container">
  <div class="header">
    <h1>⚓ PANSW Live Winds</h1>
    <span id="lastUpdated" class="updated">Loading...</span>
  </div>

  <div class="port-section">
    <div class="port-title">Sydney Harbour</div>
    <div class="grid">
      <div class="station-card">
        <div class="station-name">W Wedding Cake</div>
        <div class="wind-speed" id="cake-speed">-- kts</div>
        <div class="wind-details" id="cake-gust">Gust: --</div>
        <div class="wind-details" id="cake-dir">Dir: --</div>
      </div>
      <div class="station-card">
        <div class="station-name">Fort Denison</div>
        <div class="wind-speed" id="denison-speed">-- kts</div>
        <div class="wind-details" id="denison-gust">Gust: --</div>
        <div class="wind-details" id="denison-dir">Dir: --</div>
      </div>
    </div>
  </div>

  <div class="port-section" style="margin-bottom: 0;">
    <div class="port-title">Botany Bay</div>
    <div class="grid">
      <div class="station-card">
        <div class="station-name">Ampol Wharf</div>
        <div class="wind-speed" id="ampol-speed">-- kts</div>
        <div class="wind-details" id="ampol-gust">Gust: --</div>
        <div class="wind-details" id="ampol-dir">Dir: --</div>
      </div>
      <div class="station-card">
        <div class="station-name">Molineaux Pt</div>
        <div class="wind-speed" id="molineaux-speed">-- kts</div>
        <div class="wind-details" id="molineaux-gust">Gust: --</div>
        <div class="wind-details" id="molineaux-dir">Dir: --</div>
      </div>
    </div>
  </div>
</div>

<script>
function toCardinal(deg) {
  const n = parseFloat(deg);
  if (isNaN(n)) return '';
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(n / 22.5) % 16] + ' ';
}

function renderStation(prefix, obj) {
  if (!obj) return;
  document.getElementById(`${prefix}-speed`).textContent = `${obj.speed} kts`;
  document.getElementById(`${prefix}-gust`).textContent = `Gust: ${obj.gust} kts`;
  document.getElementById(`${prefix}-dir`).textContent = `Dir: ${toCardinal(obj.dir)}(${obj.dir}°)`;
}

function parseTextBlock(text, label) {
  const idx = text.indexOf(label);
  if (idx === -1) return null;
  const sub = text.substring(idx, idx + 450);
  const spd = sub.match(/Mean Speed:\s*([\d\.]+)\s*knots/i);
  const gst = sub.match(/Gust:\s*([\d\.]+)\s*knots/i);
  const dir = sub.match(/Dir:\s*([\d\.]+)\s*deg/i);
  return {
    speed: spd ? spd[1] : '--',
    gust: gst ? gst[1] : '--',
    dir: dir ? dir[1] : '--'
  };
}

async function loadWinds() {
  const statusEl = document.getElementById('lastUpdated');
  
  // 1. Primary: Read pre-scraped data.json from same GitHub repo (zero CORS issues)
  try {
    const res = await fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      renderStation('cake', data.wedding_cake);
      renderStation('denison', data.fort_denison);
      renderStation('ampol', data.ampol);
      renderStation('molineaux', data.molineaux);
      statusEl.textContent = data.updated || 'Live';
      return;
    }
  } catch (e) {}

  // 2. Fallback: Jina Reader bridge (CORS-enabled text extractor for Port Authority NSW)
  try {
    const res = await fetch('https://r.jina.ai/https://wavewindtide.portauthoritynsw.com.au/', {
      headers: { 'Accept': 'text/plain' },
      cache: 'no-store'
    });
    if (res.ok) {
      const text = await res.text();
      renderStation('cake', parseTextBlock(text, 'Western Wedding Cake'));
      renderStation('denison', parseTextBlock(text, 'Fort Denison'));
      renderStation('ampol', parseTextBlock(text, 'Ampol Wharf'));
      renderStation('molineaux', parseTextBlock(text, 'Molineaux Point'));
      const now = new Date();
      statusEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return;
    }
  } catch (e) {}

  statusEl.textContent = "Offline";
}

loadWinds();
setInterval(loadWinds, 180000);
</script>
</body>
</html>
