<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSW Ports Live Wind</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 14px;
      display: flex;
      justify-content: center;
    }
    .widget-container {
      width: 100%;
      max-width: 440px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .header h1 { font-size: 17px; margin: 0; font-weight: 700; color: #58a6ff; }
    .updated { font-size: 11px; color: #8b949e; }
    .port-section { margin-bottom: 14px; }
    .port-title { font-size: 11px; text-transform: uppercase; color: #3fb950; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
    .station-card {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .station-name { font-size: 14px; font-weight: 600; color: #f0f6fc; }
    .wind-speed { font-size: 20px; font-weight: 800; color: #f0883e; text-align: right; }
    .wind-details { font-size: 12px; color: #8b949e; margin-top: 2px; }
    .right-col { text-align: right; }
    .refresh-btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: #238636;
      color: white;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 6px;
    }
    .refresh-btn:active { background: #2ea043; }
  </style>
</head>
<body>

<div class="widget-container">
  <div class="header">
    <h1>⚓ NSW Port Winds</h1>
    <span id="lastUpdated" class="updated">Connecting...</span>
  </div>

  <div class="port-section">
    <div class="port-title">Sydney Harbour</div>
    <div class="station-card">
      <div>
        <div class="station-name">W Wedding Cake</div>
        <div class="wind-details" id="cake-dir">Dir: --</div>
      </div>
      <div class="right-col">
        <div class="wind-speed" id="cake-speed">-- kts</div>
        <div class="wind-details" id="cake-gust">Gust: -- kts</div>
      </div>
    </div>
    <div class="station-card">
      <div>
        <div class="station-name">Fort Denison</div>
        <div class="wind-details" id="denison-dir">Dir: --</div>
      </div>
      <div class="right-col">
        <div class="wind-speed" id="denison-speed">-- kts</div>
        <div class="wind-details" id="denison-gust">Gust: -- kts</div>
      </div>
    </div>
  </div>

  <div class="port-section">
    <div class="port-title">Botany Bay</div>
    <div class="station-card">
      <div>
        <div class="station-name">Ampol Wharf</div>
        <div class="wind-details" id="ampol-dir">Dir: --</div>
      </div>
      <div class="right-col">
        <div class="wind-speed" id="ampol-speed">-- kts</div>
        <div class="wind-details" id="ampol-gust">Gust: -- kts</div>
      </div>
    </div>
    <div class="station-card">
      <div>
        <div class="station-name">Molineaux Point</div>
        <div class="wind-details" id="molineaux-dir">Dir: --</div>
      </div>
      <div class="right-col">
        <div class="wind-speed" id="molineaux-speed">-- kts</div>
        <div class="wind-details" id="molineaux-gust">Gust: -- kts</div>
      </div>
    </div>
  </div>

  <button class="refresh-btn" onclick="fetchWindData()">Refresh Now</button>
</div>

<script>
async function fetchWithFallback(url) {
  const proxies = [
    (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
    (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
    (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`
  ];

  for (const proxyGen of proxies) {
    try {
      const target = proxyGen(url);
      const res = await fetch(target, { cache: 'no-store' });
      if (res.ok) {
        const text = await res.text();
        if (text && text.includes("Port Authority")) return text;
      }
    } catch (e) {
      // try next proxy
    }
  }
  throw new Error("Unable to reach feed");
}

function parseStation(html, keyword) {
  const idx = html.indexOf(keyword);
  if (idx === -1) return null;
  const chunk = html.substring(idx, idx + 450);

  const speed = chunk.match(/Mean Speed:\s*([\d\.]+)\s*knots/i);
  const gust = chunk.match(/Gust:\s*([\d\.]+)\s*knots/i);
  const dir = chunk.match(/Dir:\s*([\d\.]+)deg/i);

  return {
    speed: speed ? speed[1] : '--',
    gust: gust ? gust[1] : '--',
    dir: dir ? `${dir[1]}°` : '--'
  };
}

async function fetchWindData() {
  const updateEl = document.getElementById('lastUpdated');
  updateEl.textContent = "Updating...";

  try {
    const rawHtml = await fetchWithFallback('https://wavewindtide.portauthoritynsw.com.au/');

    const cake = parseStation(rawHtml, "Western Wedding Cake");
    const denison = parseStation(rawHtml, "Fort Denison");
    const ampol = parseStation(rawHtml, "Ampol Wharf");
    const molineaux = parseStation(rawHtml, "Molineaux Point");

    if (cake) {
      document.getElementById('cake-speed').textContent = `${cake.speed} kts`;
      document.getElementById('cake-gust').textContent = `Gust: ${cake.gust} kts`;
      document.getElementById('cake-dir').textContent = `Dir: ${cake.dir}`;
    }
    if (denison) {
      document.getElementById('denison-speed').textContent = `${denison.speed} kts`;
      document.getElementById('denison-gust').textContent = `Gust: ${denison.gust} kts`;
      document.getElementById('denison-dir').textContent = `Dir: ${denison.dir}`;
    }
    if (ampol) {
      document.getElementById('ampol-speed').textContent = `${ampol.speed} kts`;
      document.getElementById('ampol-gust').textContent = `Gust: ${ampol.gust} kts`;
      document.getElementById('ampol-dir').textContent = `Dir: ${ampol.dir}`;
    }
    if (molineaux) {
      document.getElementById('molineaux-speed').textContent = `${molineaux.speed} kts`;
      document.getElementById('molineaux-gust').textContent = `Gust: ${molineaux.gust} kts`;
      document.getElementById('molineaux-dir').textContent = `Dir: ${molineaux.dir}`;
    }

    const t = new Date();
    updateEl.textContent = `Updated ${t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
  } catch (err) {
    updateEl.textContent = "Error fetching data";
  }
}

fetchWindData();
setInterval(fetchWindData, 300000);
</script>
</body>
</html>
