<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NSW Ports Marine Telemetry</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .widget-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      padding: 10px 10px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 1px solid #30363d;
    }
    .header h1 { font-size: 13.5px; font-weight: 700; color: #58a6ff; }
    .updated { font-size: 10.5px; color: #8b949e; }
    
    .port-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      justify-content: center;
      padding: 4px 0;
    }
    .port-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .port-title {
      font-size: 10.5px;
      text-transform: uppercase;
      color: #3fb950;
      font-weight: 800;
      letter-spacing: 0.8px;
    }
    .tide-tag {
      font-size: 10px;
      background: #1f2a3c;
      color: #79c0ff;
      border: 1px solid #388bfd40;
      border-radius: 4px;
      padding: 1px 6px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .station-card {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 8px 10px;
    }
    .station-name {
      font-size: 11.5px;
      font-weight: 600;
      color: #c9d1d9;
      margin-bottom: 2px;
    }
    .wind-speed {
      font-size: 21px;
      font-weight: 800;
      color: #f0883e;
      line-height: 1.1;
    }
    .wind-details {
      font-size: 10.5px;
      color: #8b949e;
      margin-top: 2px;
    }

    .sea-strip {
      background: #121820;
      border: 1px dashed #30363d;
      border-radius: 6px;
      padding: 5px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      color: #a5d6ff;
    }
    .sea-strip strong { color: #58a6ff; }
  </style>
</head>
<body>

<div class="widget-container">
  <div class="header">
    <h1>⚓ PANSW Telemetry</h1>
    <span id="lastUpdated" class="updated">Syncing...</span>
  </div>

  <!-- Sydney Harbour -->
  <div class="port-section">
    <div class="port-title-bar">
      <span class="port-title">Sydney Harbour</span>
      <span class="tide-tag">Tide: <span id="syd-tide">--</span></span>
    </div>
    <div class="grid">
      <div class="station-card">
        <div class="station-name">W Wedding Cake</div>
        <div class="wind-speed" id="cake-speed">-- kts</div>
        <div class="wind-details" id="cake-gust">Gust: --</div>
        <div class="wind-details" id="cake-dir">Dir: --</div>
      </div>
      <div class="station-card">
        <div class="station-name">Fort Denison</div>
        <div class="wind-speed" id="denison-speed">-- kts</div>
        <div class="wind-details" id="denison-gust">Gust: --</div>
        <div class="wind-details" id="denison-dir">Dir: --</div>
      </div>
    </div>
    <div class="sea-strip">
      <span>🌊 <strong>Offshore Swell:</strong> <span id="syd-swell">--</span></span>
      <span id="syd-period">Tp: --</span>
    </div>
  </div>

  <!-- Botany Bay -->
  <div class="port-section">
    <div class="port-title-bar">
      <span class="port-title">Botany Bay</span>
      <span class="tide-tag">Tide: <span id="bot-tide">--</span></span>
    </div>
    <div class="grid">
      <div class="station-card">
        <div class="station-name">Ampol Wharf</div>
        <div class="wind-speed" id="ampol-speed">-- kts</div>
        <div class="wind-details" id="ampol-gust">Gust: --</div>
        <div class="wind-details" id="ampol-dir">Dir: --</div>
      </div>
      <div class="station-card">
        <div class="station-name">Molineaux Pt</div>
        <div class="wind-speed" id="molineaux-speed">-- kts</div>
        <div class="wind-details" id="molineaux-gust">Gust: --</div>
        <div class="wind-details" id="molineaux-dir">Dir: --</div>
      </div>
    </div>
    <div class="sea-strip">
      <span>🌊 <strong>Bay Waves:</strong> <span id="bot-swell">--</span></span>
      <span id="bot-period">Tp: --</span>
    </div>
  </div>
</div>

<script>
function toCardinal(deg) {
  const n = parseFloat(deg);
  if (isNaN(n)) return '';
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(n / 22.5) % 16] + ' ';
}

function renderStation(prefix, obj) {
  if (!obj) return;
  document.getElementById(`${prefix}-speed`).textContent = `${obj.speed} kts`;
  document.getElementById(`${prefix}-gust`).textContent = `Gust: ${obj.gust} kts`;
  document.getElementById(`${prefix}-dir`).textContent = `Dir: ${toCardinal(obj.dir)}(${obj.dir}°)`;
}

async function loadData() {
  const statusEl = document.getElementById('lastUpdated');
  try {
    const res = await fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' });
    if (res.ok) {
      const d = await res.json();
      renderStation('cake', d.wedding_cake);
      renderStation('denison', d.fort_denison);
      renderStation('ampol', d.ampol);
      renderStation('molineaux', d.molineaux);

      if (d.syd_tide) document.getElementById('syd-tide').textContent = d.syd_tide;
      if (d.bot_tide) document.getElementById('bot-tide').textContent = d.bot_tide;

      if (d.syd_wave) {
        document.getElementById('syd-swell').textContent = `${d.syd_wave.hs} ${toCardinal(d.syd_wave.dir)}`;
        document.getElementById('syd-period').textContent = `Tp: ${d.syd_wave.tp}`;
      }
      if (d.bot_wave) {
        document.getElementById('bot-swell').textContent = `${d.bot_wave.hs} ${toCardinal(d.bot_wave.dir)}`;
        document.getElementById('bot-period').textContent = `Tp: ${d.bot_wave.tp}`;
      }

      statusEl.textContent = d.updated || 'Live';
    }
  } catch (e) {
    statusEl.textContent = 'Updating...';
  }
}

loadData();
setInterval(loadData, 180000);
</script>
</body>
</html>
